services:
  backend:
    platform: linux/amd64
    # We're backing up a step and using the nginx image that the back end's Dockerfile specifies as a base image
    image: node:20-alpine
    depends_on:
      mongodb:
        condition: service_started
    volumes:
      # Bind-mount the source and configuration files from the back end repo:
      - ${SCICAT_BACKEND_ALS_LOCATION:-.}/src:/home/node/app/src
      - ${SCICAT_BACKEND_ALS_LOCATION:-.}/migrations:/home/node/app/migrations
      - ${SCICAT_BACKEND_ALS_LOCATION:-.}/migrate-mongo-config.js:/home/node/app/migrate-mongo-config.js
      - ${SCICAT_BACKEND_ALS_LOCATION:-.}/package.json:/home/node/app/package.json
      - ${SCICAT_BACKEND_ALS_LOCATION:-.}/tsconfig.json:/home/node/app/tsconfig.json
      - ${SCICAT_BACKEND_ALS_LOCATION:-.}/tsconfig.build.json:/home/node/app/tsconfig.build.json
      - ${SCICAT_BACKEND_ALS_LOCATION:-.}/datasetExternalLinkTemplates.example.json:/home/node/app/datasetExternalLinkTemplates.json
      # Bind-mount our cache of node packages:
      # (We can't use the one in the local repo because of platform differences.)
      - ${PWD}/services/backend/node_module_cache:/home/node/app/node_modules
      # Map in our own definitions of functional accounts:
      - ./config/functionalAccounts.json:/home/node/app/functionalAccounts.json
      # Map in scripts to configure and build:
      - ${PWD}/entrypoints/loop_entrypoints.sh:/usr/local/bin/loop_entrypoints.sh
      - ./entrypoints/npm_install.sh:/docker-entrypoints/11.sh
      - ./entrypoints/build.sh:/docker-entrypoints/10.sh
      - ./entrypoints/db_migration.sh:/docker-entrypoints/9.sh
    entrypoint:
      - loop_entrypoints.sh
      - docker-entrypoint.sh
    command: node dist/main
    working_dir: /home/node/app/
    labels:
      # Adding a label for traefik to learn which port to look for a service on
      - traefik.http.services.backend.loadbalancer.server.port=3000
    env_file:
      - ./config/.env
    healthcheck:
      test: wget --spider -Y off 'http://127.0.0.1:3000/api/v3/health'
      start_period: 5s
      interval: 30s
      timeout: 10s
      retries: 5
    restart: on-failure
